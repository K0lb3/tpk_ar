name: Test
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  run_tests:
    name: Run tests on ${{ matrix.os }} with Python ${{ matrix.py }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        py: [3.8, 3.11, 3.14]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.py }}

      - name: Install
        run: pip install .[tests]

      - uses: astral-sh/ruff-action@v3

      - name: Check code (ruff check)
        run: ruff check

      - name: Check code style (ruff format)
        run: ruff format --check

      - name: Run tests
        run: python -m pytest -vs ./tests
