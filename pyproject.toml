[project]
name = "tpk"
authors = [{ name = "Rudolf Kolbe", email = "rkolbe96@tuta.io" }]
description = "A package for parsing type tree packages (TPK)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = [
    "typing_extensions; python_version<'3.11'"
]
dynamic = ["version"]

[project.optional-dependencies]
brotli = ["brotli"]
lz4 = ["lz4"]
full = ["brotli", "lz4"]
tests = ["pytest", "tpk[full]"]
dev = ["ruff", "pyperf", "snakeviz", "tpk[tests]"]

[project.urls]
"Homepage" = "https://github.com/K0lb3/tpk"
"Bug Tracker" = "https://github.com/K0lb3/tpk/issues"

[tool.setuptools.dynamic]
version = { attr = "tpk.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.8"
